quarkus.http.test-port=0

# Exclude credential-bearing connectors — they fail CDI validation in test environments
# without Twilio/WhatsApp credentials configured.
# GE-20260521-45e61c
quarkus.arc.exclude-types=io.casehub.connectors.twilio.TwilioSmsConnector,\
  io.casehub.connectors.whatsapp.WhatsAppConnector,\
  io.casehub.connectors.signal.SignalConnector

# Dummy values for ConfigMapping validation — beans are excluded above but
# @ConfigMapping interfaces are still validated at startup.
casehub.connectors.twilio.account-sid=test
casehub.connectors.twilio.auth-token=test
casehub.connectors.twilio.from=+10000000000
casehub.connectors.whatsapp.api-token=test
casehub.connectors.whatsapp.phone-number-id=test
