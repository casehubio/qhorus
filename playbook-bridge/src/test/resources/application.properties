# InMemory alternatives for stores not owned by playbook-bridge
quarkus.arc.selected-alternatives=\
  io.casehub.qhorus.persistence.memory.InMemoryChannelStore,\
  io.casehub.qhorus.persistence.memory.InMemoryMessageStore,\
  io.casehub.qhorus.persistence.memory.InMemoryInstanceStore,\
  io.casehub.qhorus.persistence.memory.InMemoryDataStore,\
  io.casehub.qhorus.persistence.memory.InMemoryCommitmentStore,\
  io.casehub.qhorus.persistence.memory.InMemoryWatchdogStore,\
  io.casehub.qhorus.persistence.memory.InMemoryChannelBindingStore,\
  io.casehub.qhorus.persistence.memory.InMemoryDeliveryCursorStore,\
  io.casehub.qhorus.persistence.memory.InMemoryCrossTenantChannelStore,\
  io.casehub.qhorus.persistence.memory.InMemoryCrossTenantMessageStore,\
  io.casehub.qhorus.persistence.memory.InMemoryCrossTenantCommitmentStore,\
  io.casehub.qhorus.persistence.memory.InMemoryCrossTenantWatchdogStore

quarkus.http.test-port=0

# Default datasource — satisfies casehub-ledger @Default EntityManager
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:playbook_bridge_default;DB_CLOSE_DELAY=-1

# Named qhorus datasource — H2 for JPA store integration tests
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.username=sa
quarkus.datasource.qhorus.password=
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:playbook_bridge_qhorus;DB_CLOSE_DELAY=-1

# Default PU routes to qhorus datasource — includes playbook-bridge entity package
quarkus.hibernate-orm.datasource=qhorus
quarkus.hibernate-orm.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime,io.casehub.ledger.jpa
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime,io.casehub.ledger.jpa,io.casehub.qhorus.playbook.bridge
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.hibernate-orm.qhorus.sql-load-script=import-qhorus-test.sql

# Flyway disabled in tests
quarkus.flyway.qhorus.migrate-at-start=false

# Disable reactive — tests use H2 JDBC only
quarkus.datasource.reactive=false
quarkus.datasource.qhorus.reactive=false

# Omit null fields from JSON responses
quarkus.jackson.serialization-inclusion=non-null

# casehub-ledger — enabled for tests
casehub.ledger.datasource=qhorus
casehub.ledger.enabled=true
casehub.ledger.hash-chain.enabled=false
casehub.ledger.decision-context.enabled=false
casehub.ledger.attestations.enabled=true
casehub.ledger.trust-score.enabled=false

# Delivery pump disabled — not needed for playbook-bridge tests
casehub.qhorus.delivery.enabled=false

# Exclude credential-bearing connectors and duplicate ledger JPA beans
quarkus.arc.exclude-types=io.casehub.connectors.twilio.TwilioSmsConnector,\
  io.casehub.connectors.whatsapp.WhatsAppConnector,\
  io.casehub.connectors.signal.SignalConnector,\
  io.casehub.ledger.runtime.service.identity.ReactiveAgentIdentityVerificationService,\
  io.casehub.ledger.runtime.repository.jpa.JpaLedgerEntryRepository,\
  io.casehub.ledger.runtime.repository.jpa.JpaLedgerMerkleFrontierRepository

# Dummy values for ConfigMapping validation — excluded beans but interfaces still validated
casehub.connectors.twilio.account-sid=test
casehub.connectors.twilio.auth-token=test
casehub.connectors.twilio.from=+10000000000
casehub.connectors.whatsapp.api-token=test
casehub.connectors.whatsapp.phone-number-id=test
